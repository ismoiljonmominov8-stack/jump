<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kangaroo Jump Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#F7F5F0; --surface:#FFFFFF; --surface-2:#F0EAE0; --ink:#241C10; --ink-2:#5B5140; --muted:#8A7E68;
  --line:#E4DCCB; --brand:#A8552A; --brand-ink:#FFFFFF; --s1:#6D3BD6; --s2:#00968C;
  --good:#1F8A4C; --bad:#C6303F; --gold:#E8A93A; --radius:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16120C; --surface:#211A12; --surface-2:#2C2318; --ink:#F5EEE2; --ink-2:#D0C4AE; --muted:#9E9279;
  --line:#3A2F21; --brand:#D97B3C; --brand-ink:#190F06; --s1:#8F6BF0; --s2:#12A093;
  --good:#4FD08A; --bad:#FF6B75; --gold:#F0BE5E;
}}
:root[data-theme="dark"]{
  --bg:#16120C; --surface:#211A12; --surface-2:#2C2318; --ink:#F5EEE2; --ink-2:#D0C4AE; --muted:#9E9279;
  --line:#3A2F21; --brand:#D97B3C; --brand-ink:#190F06; --s1:#8F6BF0; --s2:#12A093;
  --good:#4FD08A; --bad:#FF6B75; --gold:#F0BE5E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2{line-height:1.2;text-wrap:balance;margin:0}
.hide{display:none!important}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .name{font-weight:800;margin-right:auto;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--brand)}
.page{padding:18px 16px 64px;max-width:1040px;width:100%;margin:0 auto}
.btn{border:1px solid transparent;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:700;
  padding:11px 18px;cursor:pointer;transition:filter .15s,transform .06s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--surface);color:var(--ink-2);border:0;padding:7px 11px;cursor:pointer;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.grid{display:grid;gap:14px} .cols{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.tile{background:var(--surface-2);border-radius:14px;padding:13px 14px}
.tile .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-size:clamp(21px,4.4vw,29px);font-weight:800;font-variant-numeric:tabular-nums}
.tile .u{font-size:13px;color:var(--ink-2);font-weight:600}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num,th.num{text-align:right}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:13px}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.item .grow{flex:1;min-width:120px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.note{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink-2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:2px 0 6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
figure{margin:0} figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.chart-wrap{overflow-x:auto}
ol.steps{padding-left:20px;margin:8px 0 0} ol.steps li{margin:6px 0}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;
  padding:5px 9px;border-radius:8px;opacity:0;transition:opacity .12s}

#run{position:fixed;inset:0;z-index:40;background:#0C0A06;color:#FFF3E2}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cv{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;
  display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.chip{background:rgba(12,10,6,.66);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:7px 11px;
  font-weight:700;font-size:13px;color:#FFF3E2;cursor:pointer}
#big{position:absolute;left:0;right:0;top:26%;text-align:center;z-index:3;padding:0 14px}
#bigNum{font-size:clamp(44px,15vw,96px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;
  text-shadow:0 4px 20px rgba(0,0,0,.75)}
#bigSub{font-weight:700;font-size:clamp(14px,4vw,20px);margin-top:6px;text-shadow:0 2px 10px rgba(0,0,0,.85)}
#btnRow{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:0 14px;z-index:4;
  display:flex;flex-direction:column;gap:10px;align-items:center}
.bigbtn{border:3px solid #fff;border-radius:999px;background:var(--brand);color:#fff;font-weight:800;letter-spacing:.05em;
  font-size:clamp(17px,4.6vw,24px);padding:15px 30px;width:100%;max-width:440px;cursor:pointer}
.bigbtn.ghost{background:rgba(255,255,255,.16)}
#feetH{position:absolute;left:0;right:0;height:52px;margin-top:-26px;z-index:5;touch-action:none;cursor:ns-resize}
#feetH::before{content:"";position:absolute;left:0;right:0;top:25px;height:3px;background:var(--gold);box-shadow:0 0 10px rgba(0,0,0,.6)}
#feetH span{position:absolute;left:12px;top:4px;background:var(--gold);color:#190F06;font-size:11px;font-weight:800;
  padding:3px 8px;border-radius:7px}
#rot{position:absolute;inset:0;z-index:9;background:rgba(12,10,6,.94);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:24px}
@media print{.bar,.noprint{display:none!important} body{background:#fff;color:#000} .card{border:1px solid #bbb;break-inside:avoid}}
</style>

<header class="bar noprint">
  <span class="name"><span class="dot"></span><span data-t="app"></span></span>
  <span class="seg" id="langSeg">
    <button data-lang="uz" aria-pressed="true">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
  </span>
  <button class="btn sec sm" id="navHome" data-t="nav_home"></button>
  <button class="btn sec sm" id="navCoach" data-t="nav_coach"></button>
</header>

<main class="page" id="home">
  <div class="grid" style="gap:18px">
    <div class="card">
      <h1 style="font-size:clamp(24px,5vw,34px)" data-t="home_title"></h1>
      <p class="muted" style="margin:8px 0 0" data-t="home_sub"></p>
      <div class="row" style="margin-top:16px">
        <label class="small muted" for="playerSel" data-t="athlete"></label>
        <select id="playerSel" style="min-width:180px"></select>
        <button class="btn sec sm" id="addPlayer" data-t="add_athlete"></button>
      </div>
      <div class="row" style="margin-top:16px">
        <button class="btn" id="startBtn" data-t="start_test"></button>
      </div>
    </div>
    <div class="card" id="lastCard"></div>
    <div class="card"><h2 style="font-size:18px" data-t="setup_title"></h2><ol class="steps" id="setupSteps"></ol></div>
  </div>
</main>

<main class="page hide" id="coach">
  <h1 style="font-size:clamp(22px,4.6vw,30px)" data-t="coach_title"></h1>
  <div class="grid" style="margin-top:16px">
    <div class="card"><div class="row" style="justify-content:space-between">
      <h2 style="font-size:19px" data-t="groups"></h2><button class="btn sm" id="addGroup" data-t="new_group"></button></div>
      <div class="list" id="groupList" style="margin-top:14px"></div></div>
    <div class="card"><div class="row" style="justify-content:space-between">
      <h2 style="font-size:19px" data-t="athletes"></h2><button class="btn sm" id="addPlayer2" data-t="add_athlete"></button></div>
      <div class="list" id="playerList" style="margin-top:14px"></div></div>
    <div class="card"><h2 style="font-size:19px" data-t="tests"></h2><div class="list" id="testList" style="margin-top:14px"></div></div>
    <div class="row"><button class="btn sec sm" id="exportBtn" data-t="export_csv"></button></div>
  </div>
</main>

<main class="page hide" id="report"></main>
<main class="page hide" id="groupView"></main>
<main class="page hide" id="groupReport"></main>

<div id="run" class="hide">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
  <div id="feetH"><span data-t="feet_line"></span></div>
  <div class="hud">
    <button class="chip" id="quit" data-t="exit"></button>
    <span class="chip" id="whoChip"></span>
    <span class="chip" id="attChip"></span>
    <span class="chip" id="tgtChip"></span>
  </div>
  <div id="big"><div id="bigNum">0</div><div id="bigSub"></div></div>
  <div id="btnRow">
    <button class="bigbtn" id="goBtn" data-t="ready"></button>
    <button class="bigbtn ghost hide" id="againBtn" data-t="next_try"></button>
    <button class="bigbtn ghost hide" id="doneBtn" data-t="finish"></button>
  </div>
  <div id="rot" class="hide">
    <div style="font-size:60px;line-height:1">\u{1F4F1}</div>
    <h2 id="rotT" style="font-size:22px;margin:10px 0 6px"></h2>
    <p id="rotX" class="small" style="max-width:32ch;opacity:.9;margin:0"></p>
  </div>
</div>
<div id="tip"></div>

function f2(v){ return v==null? "–": v.toFixed(2); }
function bestH(tst){ return tst.attempts.length? Math.max.apply(null, tst.attempts.map(function(a){return a.h;})):null; }
function bestOfTests(list){ var v=list.map(bestH).filter(function(x){return x!=null;}); return v.length? Math.max.apply(null,v):null; }
function dateStr(iso){ var d=new Date(iso);
  return d.toLocaleDateString(lang==="uz"?"uz-UZ":(lang==="ru"?"ru-RU":"en-GB"))+" "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }
function groupAvgH(age, excludeAthlete){
  var v=[]; jumps().forEach(function(s){
    if(excludeAthlete && s.athleteId===excludeAthlete) return;
    var a=db.athletes.filter(function(p){return p.id===s.athleteId;})[0];
    if(a&&a.age===age){ var b=bestH(s); if(b!=null) v.push(b); }
  });
  return v.length>=3? mean(v):null;
}
function kangaTarget(list){
  var b=bestOfTests(list), n=list.length;
  if(b==null) return 14;                                  // easy first bar
  return b*Math.min(1.25, 0.97 + 0.03*Math.max(1,n));     // rises with each test
}

function testTiles(s, ath){
  var hs=s.attempts.map(function(a){return a.h;}), b=bestH(s), fl=s.attempts.filter(function(a){return a.h===b;})[0];
  function tl(k,v,u){ return '<div class="tile"><div class="k">'+k+'</div><div class="v">'+v+'<span class="u"> '+(u||"")+'</span></div></div>'; }
  var w = ath&&ath.weight? sayersW(b, ath.weight):null;
  return '<div class="tiles">'+
    tl(t("best"), f1(b), t("cm"))+
    tl(t("flight"), fl? f2(fl.t):"–", t("sec"))+
    tl(t("takeoff"), fl? f2(takeoffV(fl.t)):"–", t("mps"))+
    tl(t("mean"), f1(mean(hs)), t("cm"))+
    tl(t("consistency"), f1(sd(hs)), t("cm"))+
    (w? tl(t("power"), Math.round(w), t("watt")):"")+'</div>';
}

var tipEl=document.getElementById("tip");
document.addEventListener("mousemove",function(ev){

  if(el){ tipEl.textContent=el.getAttribute("data-lbl"); tipEl.style.opacity="1";

  else tipEl.style.opacity="0";

function attemptBars(s){
  if(!s.attempts.length) return "";
  var W=460, rowH=38, H=rowH*s.attempts.length+14, P={l:86,r:70,t:6};
  var b=bestH(s), max=b*1.2;
  var out="";
  s.attempts.forEach(function(a,i){
    var w=(W-P.l-P.r)*(a.h/max), y=P.t+i*rowH;
    out+='<text x="'+(P.l-10)+'" y="'+(y+24)+'" text-anchor="end" font-size="13" fill="var(--ink-2)">'+t("att")+' '+(i+1)+'</text>'+
      '<rect x="'+P.l+'" y="'+(y+8)+'" width="'+w.toFixed(1)+'" height="22" rx="4" fill="var(--s1)" '+
      (a.h===b? 'opacity="1"':'opacity=".62"')+' data-lbl="'+f1(a.h)+' '+t("cm")+' · '+f2(a.t)+' '+t("sec")+'"/>'+
      '<text x="'+(P.l+w+8)+'" y="'+(y+25)+'" font-size="13" font-weight="700" fill="var(--ink)">'+f1(a.h)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" style="min-width:380px">'+out+'</svg>';
}
function progressChart(list, gb){
  if(!list.length) return '<p class="muted">'+t("no_data")+'</p>';
  var pts=list.map(bestH).filter(function(x){return x!=null;});
  if(!pts.length) return '<p class="muted">'+t("no_data")+'</p>';
  var W=640,H=230,P={l:46,r:14,t:14,b:30};
  var all=pts.concat(gb?[gb]:[]);
  var mx=Math.max.apply(null,all)*1.08, mn=Math.max(0,Math.min.apply(null,all)-(mx-Math.min.apply(null,all))*0.35);
  var x=function(i){ return P.l+(W-P.l-P.r)*(pts.length<2?0.5:i/(pts.length-1)); };
  var y=function(v){ return H-P.b-(H-P.t-P.b)*((v-mn)/(mx-mn)); };
  var s="",i;
  for(i=0;i<=4;i++){ var v=mn+(mx-mn)*i/4, yy=y(v);
    s+='<line x1="'+P.l+'" y1="'+yy+'" x2="'+(W-P.r)+'" y2="'+yy+'" stroke="var(--line)"/>'+
       '<text x="'+(P.l-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+v.toFixed(0)+'</text>'; }
  if(gb) s+='<line x1="'+P.l+'" y1="'+y(gb)+'" x2="'+(W-P.r)+'" y2="'+y(gb)+'" stroke="var(--s2)" stroke-width="2" stroke-dasharray="7 5"/>';
  s+='<path d="'+pts.map(function(v,i){return (i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1);}).join(" ")+'" fill="none" stroke="var(--s1)" stroke-width="2"/>';
  pts.forEach(function(v,i){ s+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" data-lbl="'+f1(v)+' '+t("cm")+'"/>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" style="min-width:520px">'+s+'</svg>';
}

     '<div class="card"><h1 style="font-size:24px">'+p.name+' · '+p.age+(p.weight? ' · '+p.weight+' kg':'')+'</h1>'+
       '<p class="muted small" style="margin:4px 0 14px">'+dateStr(s.date)+' · '+ts.length+' '+t("tests")+

         (p.weight? '<th class="num">'+t("power")+'</th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+
       '<div class="card"><h2 style="font-size:18px">'+t("progress")+' ('+t("cm")+')</h2>'+
         '<div class="legend"><span><i style="background:var(--s1)"></i>'+t("athlete_line")+'</span>'+
         (gb? '<span><i style="background:var(--s2)"></i>'+t("group_avg")+'</span>':'')+'</div>'+progressChart(ts,gb)+'</div>'+

    el.href=URL.createObjectURL(new Blob([rows.map(function(r){return r.join(",");}).join("\n")],{type:"text/csv"}));
    el.download=p.name.replace(/[^\w-]+/g,"_")+"-jump-"+s.date.slice(0,10)+".csv"; el.click();

function groupRows(g){
  var rows=g.members.map(function(aid){
    var a=db.athletes.filter(function(p){return p.id===aid;})[0]; if(!a) return null;
    var ts=testsOf(aid), b=bestOfTests(ts);
    return {a:a, b:b, ts:ts};
  }).filter(Boolean);
  var done=rows.filter(function(x){return x.b!=null;});
  done.sort(function(x,y){ return y.b-x.b; });
  var top=done.length? done[0].b:null;
  done.forEach(function(x,i){ x.rank=i+1; x.score= top? Math.round(200*x.b/top)/10:null; });
  return {rows:rows, done:done};
}

function addMember(g){
  var free=db.athletes.filter(function(p){return g.members.indexOf(p.id)<0;});
  var msg=free.map(function(p,i){return (i+1)+") "+p.name+" ("+p.age+")";}).join("\n");
  var pick=prompt(t("add_member")+"\n"+msg+"\n\n0) + "+t("add_athlete"),"0"); if(pick===null) return;
  var n=parseInt(pick,10);
  if(n===0){ var nm=prompt(t("name_q")); if(!nm) return;
    var ag=parseInt(prompt(t("age_q")),10)||10; var kg=parseFloat(prompt(t("weight_q")))||null;
    var p={id:"a"+Date.now(),name:nm.trim(),age:ag}; if(kg) p.weight=kg;
    db.athletes.push(p); g.members.push(p.id); }
  else if(free[n-1]) g.members.push(free[n-1].id);
  save(); groupView(g.id);
}
function groupBar(done){
  if(!done.length) return "";
  var W=560,rowH=34,H=rowH*done.length+16,P={l:120,r:70,t:8};
  var max=Math.max.apply(null,done.map(function(x){return x.b;}))*1.15, out="";
  done.forEach(function(x,i){
    var w=(W-P.l-P.r)*(x.b/max), y=P.t+i*rowH;
    var medal=x.rank===1?"\u{1F947} ":(x.rank===2?"\u{1F948} ":(x.rank===3?"\u{1F949} ":""));
    out+='<text x="'+(P.l-10)+'" y="'+(y+21)+'" text-anchor="end" font-size="13" fill="var(--ink-2)">'+medal+x.a.name+'</text>'+
      '<rect x="'+P.l+'" y="'+(y+7)+'" width="'+w.toFixed(1)+'" height="20" rx="4" fill="var(--s1)" data-lbl="'+x.a.name+' — '+f1(x.b)+' '+t("cm")+'"/>'+
      '<text x="'+(P.l+w+8)+'" y="'+(y+22)+'" font-size="13" font-weight="700" fill="var(--ink)">'+f1(x.b)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" style="min-width:440px">'+out+'</svg>';
}

    var rows=[["group","rank","athlete","age","weight_kg","date","best_cm","mean_cm","power_w","score_20"]];
    done.forEach(function(x){ var ts=x.ts[x.ts.length-1];
      rows.push([g.name,x.rank,x.a.name,x.a.age,x.a.weight||"",ts.date,x.b.toFixed(1),
        mean(ts.attempts.map(function(a){return a.h;})).toFixed(1), x.a.weight? Math.round(sayersW(x.b,x.a.weight)):"", x.score]); });
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([rows.map(function(r){return r.join(",");}).join("\n")],{type:"text/csv"}));
    a.download=g.name.replace(/[^\w-]+/g,"_")+"-jump.csv"; a.click();
  };
}

document.getElementById("navHome").onclick=function(){ go("home"); };
document.getElementById("navCoach").onclick=function(){ go("coach"); };
document.getElementById("addGroup").onclick=function(){
  var n=prompt(t("group_name_q")); if(!n) return;
  db.groups.push({id:"g"+Date.now(),name:n.trim(),created:new Date().toISOString(),members:[]}); save(); render(); };
function addAthlete(){
  var n=prompt(t("name_q")); if(!n) return;
  var ag=parseInt(prompt(t("age_q")),10)||10, kg=parseFloat(prompt(t("weight_q")))||null;
  var p={id:"a"+Date.now(),name:n.trim(),age:ag}; if(kg) p.weight=kg;
  db.athletes.push(p); save(); players(); document.getElementById("playerSel").value=p.id; render();
}
document.getElementById("addPlayer").onclick=addAthlete;
document.getElementById("addPlayer2").onclick=addAthlete;
document.addEventListener("click",function(e){
  var g=e.target.closest("[data-group]"); if(g){ go("group",g.getAttribute("data-group")); return; }
  var gd=e.target.closest("[data-delgroup]");
  if(gd){ db.groups=db.groups.filter(function(x){return x.id!==gd.getAttribute("data-delgroup");}); save(); render(); return; }
  var um=e.target.closest("[data-unmember]");
  if(um){ var gg=db.groups.filter(function(x){return x.id===activeGroup;})[0];
    if(gg){ gg.members=gg.members.filter(function(id){return id!==um.getAttribute("data-unmember");}); save(); groupView(gg.id);} return; }
  var wt=e.target.closest("[data-weight]");
  if(wt){ var ath=db.athletes.filter(function(p){return p.id===wt.getAttribute("data-weight");})[0];
    if(ath){ var kg=parseFloat(prompt(t("weight_q"), ath.weight||"")); if(kg) ath.weight=kg; else delete ath.weight; save(); render(); } return; }
  var ts2=e.target.closest("[data-test]");
  if(ts2){ document.getElementById("playerSel").value=ts2.getAttribute("data-test"); openRun(); return; }
  var op=e.target.closest("[data-open]"); if(op){ go("report",op.getAttribute("data-open")); return; }
});
document.getElementById("exportBtn").onclick=function(){
  var rows=[["athlete","age","weight_kg","date","attempt","flight_s","height_cm","best_cm"]];
  jumps().forEach(function(s){
    var a=db.athletes.filter(function(p){return p.id===s.athleteId;})[0]||{name:"?",age:""};
    var b=bestH(s);
    s.attempts.forEach(function(at,i){ rows.push([a.name,a.age,a.weight||"",s.date,i+1,at.t.toFixed(3),at.h.toFixed(1),b.toFixed(1)]); });
  });
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([rows.map(function(r){return r.join(",");}).join("\n")],{type:"text/csv"}));
  a.download="jump-tests.csv"; a.click();
};

  feetH.addEventListener("pointerdown",function(ev){ on=true; feetH.setPointerCapture(ev.pointerId); });
  feetH.addEventListener("pointermove",function(ev){
    if(!on) return; var r=cv.getBoundingClientRect();
    feetY=Math.max(0.25, Math.min(0.97,(ev.clientY-r.top)/r.height)); placeFeet(); ev.preventDefault();
  });
  feetH.addEventListener("pointerup",function(){ on=false; });
  feetH.addEventListener("pointercancel",function(){ on=false; });
})();
function checkRot(){
  var landscape = window.innerWidth > window.innerHeight;
  rot.classList.toggle("hide", !landscape || elRun.classList.contains("hide"));
}
window.addEventListener("resize",function(){ placeFeet(); checkRot(); });

function draw(){
  requestAnimationFrame(draw);
  if(elRun.classList.contains("hide")) return;
  checkRot(); placeFeet();
  var dpr=Math.min(window.devicePixelRatio||1,2), now=performance.now()/1000, e=now-t0;
  if(cv.width!==(cv.clientWidth*dpr|0)||cv.height!==(cv.clientHeight*dpr|0)){
    cv.width=cv.clientWidth*dpr|0; cv.height=cv.clientHeight*dpr|0;
  }
  var W=cv.width, H=cv.height;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);

  var cur=grabGray();
  if(st==="set"){
    if(e<0.35){ /* settle */ }
    else if(!refFrame && cur){ refFrame=cur; }
    else if(e<1.6){ if(cur){ var d0=bandDiff(cur); noise=(noise*nS+d0)/(nS+1); nS++; } }
    bigNum.textContent=e<1.6? "…" : "↑";
    bigSub.textContent=e<1.6? t("get_ready") : t("jump_now");
    if(e>=1.6 && Math.abs(e-1.6)<0.05) beep(1000,0.35,0.26);
    if(e>=1.6) st="armed";
  } else if(st==="armed"){
    diffNow=cur? bandDiff(cur):0;
    var thr=Math.max(14, noise*3.5+6);
    if(diffNow>thr){ hi++; if(hi>=2){ tTakeoff=now-0.016; st="flight"; lo=0; } } else hi=0;
    bigSub.textContent=t("waiting");
    if(e>12){ bigSub.textContent=t("invalid"); st="result"; showButtons(); }
  } else if(st==="flight"){
    diffNow=cur? bandDiff(cur):0;
    var back=Math.max(8, noise*2+3);
    if(diffNow<back){ lo++; if(lo>=2) onLanding(now-0.016-tTakeoff); } else lo=0;
    bigNum.textContent=((now-tTakeoff)*1000|0)+" ms";
    bigSub.textContent=t("jump_now");
  }

  /* ---------- overlay: height scale + kangaroo ---------- */
  var scaleX=W*0.12, top=H*0.16, bot=H*(feetY-0.02), maxCm=Math.max(50, target*1.5, (lastJump||0)*1.3);
  var yFor=function(cm){ return bot-(bot-top)*(cm/maxCm); };
  ctx.save();
  ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=2*dpr;
  ctx.beginPath(); ctx.moveTo(scaleX,top); ctx.lineTo(scaleX,bot); ctx.stroke();
  ctx.font="700 "+(H*0.018)+"px Inter, sans-serif"; ctx.fillStyle="rgba(255,255,255,.75)"; ctx.textAlign="right";
  for(var cm=0; cm<=maxCm; cm+=10){
    var y=yFor(cm);
    ctx.beginPath(); ctx.moveTo(scaleX-8*dpr,y); ctx.lineTo(scaleX+8*dpr,y); ctx.stroke();
    ctx.fillText(cm+"", scaleX-12*dpr, y+4*dpr);
  }
  /* kangaroo bar */
  var ty=yFor(target);
  ctx.strokeStyle="#F0BE5E"; ctx.lineWidth=3*dpr; ctx.setLineDash([10*dpr,7*dpr]);
  ctx.beginPath(); ctx.moveTo(scaleX,ty); ctx.lineTo(W*0.62,ty); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle="#F0BE5E"; ctx.textAlign="left"; ctx.font="800 "+(H*0.022)+"px Inter, sans-serif";
  ctx.fillText("\u{1F998} "+f1(target)+" "+t("cm"), scaleX+10*dpr, ty-8*dpr);
  /* last jump bar */
  if(lastJump!=null){
    var ly=yFor(lastJump);
    ctx.strokeStyle= lastJump>=target? "#63E39B":"#FF6B75"; ctx.lineWidth=4*dpr;
    ctx.beginPath(); ctx.moveTo(scaleX,ly); ctx.lineTo(W*0.62,ly); ctx.stroke();
    ctx.fillStyle=ctx.strokeStyle; ctx.fillText(f1(lastJump)+" "+t("cm"), scaleX+10*dpr, ly-8*dpr);
  }
  /* kangaroo figure, jumping when the child jumps */
  var kPhase=0, kLift=0;
  if(st==="flight"){ kPhase=2; kLift=1; }
  else if(st==="result" && (now-kangaT0)<1.1){
    var kk=(now-kangaT0)/1.1; kPhase = kk<0.2?1:(kk<0.75?2:3); kLift=Math.sin(Math.min(1,kk/0.75)*Math.PI);
  } else kPhase = (Math.floor(now*2)%6===0)? 1:0;
  var im=kang[kPhase];
  if(im&&im.width){
    var kh=H*0.26, kw=im.width/im.height*kh;
    var kx=Math.max(W*0.55, W-kw-W*0.05);
    var ky=bot - kh - (bot-ty)*kLift;
    ctx.drawImage(im, kx, ky, kw, kh);
  }
  /* live band meter */
  var mh=H*0.006, mw=W*0.5*Math.min(1, diffNow/40);
  ctx.fillStyle="rgba(255,255,255,.2)"; ctx.fillRect(W*0.25, H*0.11, W*0.5, mh);
  ctx.fillStyle="#F0BE5E"; ctx.fillRect(W*0.25, H*0.11, mw, mh);
  ctx.restore();
}

goBtn.onclick=startAttempt;
againBtn.onclick=startAttempt;
doneBtn.onclick=function(){ saveTest(); closeRun(); go(activeGroup?"group":"coach", activeGroup); };
document.getElementById("quit").onclick=function(){ saveTest(); closeRun(); };
document.getElementById("startBtn").onclick=openRun;

applyLang(); go("home");
})();
</script>
